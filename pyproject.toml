[project]
name = "tsetlin-trader"
version = "0.1.0"
description = "Interpretable ML trading engine — Tsetlin Machine rule-based signals executed as paper trades via Alpaca."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.30",
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "logic-alpha-tm @ git+https://github.com/naibwedi/logic-alpha-tm.git",
]

[project.optional-dependencies]
tm = ["tmu==0.8.3", "numpy>=1.26,<2", "scipy>=1.10,<1.13", "scikit-learn>=1.3,<1.6"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
