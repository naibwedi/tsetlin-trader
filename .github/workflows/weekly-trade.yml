name: Paper trade cycle (self-hosted only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PAPER to authorize one supervised paper-account cycle"
        required: true

permissions:
  contents: read

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run-cycle:
    if: ${{ inputs.confirmation == 'PAPER' }}
    runs-on: [self-hosted, tsetlin-paper]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install --no-deps -e .

      - name: Run offline tests
        run: pytest -q -p no:cacheprovider

      - name: Verify private durable state
        env:
          TT_STATE_DIR: ${{ vars.TT_STATE_DIR }}
        run: |
          test -n "$TT_STATE_DIR"
          test -d "$TT_STATE_DIR"
          test -f "$TT_STATE_DIR/state.json"
          test -f "$TT_STATE_DIR/account.json"

      - name: Run one supervised paper cycle
        env:
          BROKER_PROVIDER: alpaca
          SIGNAL_PROVIDER: blend
          SIGNAL_HISTORY_START: "2008-01-01"
          SHADOW_MODELS: "tmu,bernoulli"
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TT_STATE_DIR: ${{ vars.TT_STATE_DIR }}
          MAX_DRAWDOWN_PCT: "0.15"
          POSITION_FRACTION: "0.25"
        run: python -m tsetlin_trader.run_cycle
